# Alembic configuration.
#
# sqlalchemy.url is intentionally EMPTY. The database URL comes from the
# application's own Settings object (migrations/env.py), so there is exactly one
# place a connection string is defined and it can never drift from the app's.
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

# Migration filenames sort chronologically and read as a changelog.
file_template = %%(rev)s_%%(slug)s

# Logging is deliberately NOT configured here.
#
# Alembic's generated env.py calls `fileConfig()` on this file, which disables
# every existing logger and replaces the root handler. That would make the
# migration runner the one process in this system emitting an unformatted,
# unredacted log - and, because the integration suite runs migrations in
# process, it silently wiped logging for every test that ran afterwards.
#
# migrations/env.py calls the application's own `configure_logging()` instead,
# so a migration logs exactly like the API does. See app/obs/logging.py.
