[project]
name = "adaptive-ai-interviewer"
version = "0.1.0"
description = "Adaptive technical-interview engine: IRT ability model + LLM grader"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30,<0.31",
    "redis>=5.2,<6.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=23.1,<24.0",
    "pyjwt>=2.10,<3.0",
    "email-validator>=2.2,<3.0",
    # OpenAI-compatible client. Used to talk to NVIDIA, not to OpenAI:
    # the SDK is a transport for a wire format several vendors implement.
    "openai>=1.60,<2.0",
    # Observability (Day 4). The API and SDK are the instrumentation; the OTLP
    # exporter is how spans reach a collector or a self-hosted Langfuse.
    # `opentelemetry-instrumentation-*` packages are versioned separately from
    # the core (0.65b0 pairs with 1.44.x) and are published as pre-releases,
    # which is upstream's own convention rather than an instability signal.
    "opentelemetry-api>=1.44,<1.45",
    "opentelemetry-sdk>=1.44,<1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<1.45",
    "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
    # pgvector's SQLAlchemy type (Day 8). Pure Python and tiny: it teaches
    # SQLAlchemy the `vector` column type and the distance operators. The
    # *extension* is installed by infra/postgres/init/001-extensions.sql.
    "pgvector>=0.3,<0.4",
]

[project.optional-dependencies]
# The embedding model runtime (Day 8). Deliberately OPTIONAL, for two reasons:
# CI never needs it, because the test suite runs against a deterministic
# in-repo embedder; and it pulls ~200 MB of onnxruntime that nothing else in
# the project uses. Install it when you want real semantic search locally:
#     pip install -e "./backend[embeddings]"
embeddings = [
    # ONNX runtime for BAAI/bge-small-en-v1.5. Chosen over sentence-transformers
    # because it needs no PyTorch (~2.5 GB) for a 133 MB model, and because
    # bge-small-en-v1.5 is fastembed's own default - pooling and L2
    # normalisation are handled the way the model card specifies.
    "fastembed>=0.4,<0.8",
]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "httpx>=0.27,<0.29",
    "asgi-lifespan>=2.1,<3.0",
    "ruff>=0.7,<0.9",
    "mypy>=1.13,<2.0",
    # Reads .github/workflows/ci.yml so the CI gates can be asserted on.
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The default suite is deterministic, offline and free.
#   `not smoke`      - the live NVIDIA test, opted into with `pytest -m smoke tests/smoke`.
#   `not embeddings` - the tests that load the real bge model, which needs the
#                      optional [embeddings] extra and a one-time 133 MB download.
#                      Opt in with `pytest -m embeddings`.
addopts = "-q -m 'not smoke and not embeddings'"
markers = [
    "smoke: hits a real LLM provider; needs NVIDIA_API_KEY; excluded by default",
    "embeddings: loads the real bge-small-en-v1.5 model; needs the [embeddings] extra",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "BLE"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom; B008 does not apply.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# S105/S106: hardcoded test secrets are intentional.
# S311: a seeded `random.Random` is how the Day 12 epsilon-greedy tests stay
# deterministic. The rule is about cryptographic use; there is none in tests.
"tests/*" = ["S105", "S106", "S311"]
# S311 again: the Day 13 simulation IS seeded pseudo-randomness - synthetic
# candidates, Beta-distributed grades, policy exploration. Reproducibility is
# the requirement; cryptographic strength would actively break it.
"app/simulation/*" = ["S311"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# pgvector ships no py.typed marker; fastembed is an OPTIONAL extra, so in CI -
# where `mypy --strict app` runs without it - the module is genuinely absent.
# Both are used behind our own typed wrappers (app/models/question.py and
# app/retrieval/embedders.py), which is where the types that matter are declared.
[[tool.mypy.overrides]]
module = ["pgvector.*", "fastembed.*"]
ignore_missing_imports = true
